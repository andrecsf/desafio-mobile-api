<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap" rel="stylesheet">
    <title>App de Poesia Aleatória</title>
</head>

<body>
    <div class="container">
        <img src="" alt="">
        <h2 class="titulo">Poesia Aleatória</h2>
        <hr />
        <p class="descricao">Aqui você pode receber poesias aleatórias e expandir seu conhecimento e sua prática de
            leitura.
        </p>
        <p>Clique para ver sua poesia!</p>
        <div class="botoes">
            <button onclick="getPoesia()">Sortear!</button>
            <button id="btn-audio">🔊</button>
        </div>
        <hr />
        <div id="poesia">
        </div>

    </div>

    <script src="script.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(() => console.log("Service Worker registrado"))
                .catch(err => console.log("Erro:", err));
        }
    </script>

    <button onclick="testarAudio()">TESTAR AUDIO</button>

<script>
function testarAudio() {
  const fala = new SpeechSynthesisUtterance("Hello, testing audio");
  fala.lang = "en-US";
  speechSynthesis.speak(fala);
}
</script>

</body>

</html>
